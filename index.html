<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Snake Water Gun</title>
  <!-- HTML -->
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header id="heading">
   snake 🐍 water 🌊 gun 🔫 
  </header>
  <main>
    <div class="choices">
      <div class="choice" id="snake"></div>
      <div class="choice" id="water"></div>
      <div class="choice" id="gun"></div>
    </div>
    <div class="scoreBoard">
      <div>
        <div id="userScore">0</div>
        <div>You</div>
      </div>
      <div>
        <div id="compScore">0</div>
        <div>Comp</div>
      </div>
    </div>
    <div id="msgContainer">
      <div id="msg">Choose any one from 3!</div>
    </div>
  </main>
  <script src="main.js"></script>
</body>
</html>
